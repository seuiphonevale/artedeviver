                    <h4 style="font-size:0.85rem; color:var(--texto-secundario); margin-bottom:8px;">Subcategorias vinculadas:</h4>
                    <div id="lista-subs-config" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;"></div>
                    <button class="btn-salvar" style="width:100%;" onclick="abrirModalNovaSubcategoria()">+ Incluir Subcategoria</button>
                </div>
            </div>

            <div id="agenda-semanal" style="display: flex; flex-direction: column; gap: 16px;"></div>

        </div>

        <div class="custom-modal-overlay" id="custom-modal">
            <div class="custom-modal-box">
                <h3 id="modal-titulo">Editar Informação</h3>
                <input type="text" class="input-texto" id="modal-input-valor" placeholder="Digite o novo valor...">
                <div class="modal-botoes">
                    <button class="btn-salvar" style="background:#2c2c2e; color:#fff; width:50%;" onclick="fecharModalCustom()">Cancelar</button>
                    <button class="btn-salvar" style="width:50%;" id="modal-btn-confirmar">Salvar</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        // Escuta e aguarda a inicialização do Firebase injetado no escopo global window
        function inicializarAplicativoCloud() {
            if (!window.fbDB) {
                setTimeout(inicializarAplicativoCloud, 50);
                return;
            }
            
            // Sincronização em tempo real das categorias do Firebase
            window.fbOnValue(window.fbRef(window.fbDB, 'dadosCategorias'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    dadosCategorias = data;
                } else {
                    window.fbSet(window.fbRef(window.fbDB, 'dadosCategorias'), dadosCategorias);
                }
            });

            // Sincronização em tempo real da rotina completa do usuário do Firebase
            window.fbOnValue(window.fbRef(window.fbDB, 'rotinaUsuario'), (snapshot) => {
                const data = snapshot.val();
                rotinaUsuario = data || {};
                if (document.getElementById('app-principal-wrapper').classList.contains('visivel')) {
                    renderizarAgenda();
                }
            });
        }
        inicializarAplicativoCloud();
    </script>

    <script>
        let dadosCategorias = {
            1: { nome: "Saúde física", icone: "fa-heartbeat", subs: ["Alimentação", "Exercícios", "Sono", "Consultas médicas"] },
            2: { nome: "Saúde mental/emocional", icone: "fa-brain", subs: ["Controle do estresse", "Lazer", "Autoconhecimento", "Equilíbrio emocional"] },
            3: { nome: "Família", icone: "fa-users", subs: ["Relacionamento com parentes", "Relacionamento com filhos", "Relacionamento com cônjuge", "Tempo de qualidade"] },
            4: { nome: "Relacionamentos/amizades", icone: "fa-comments", subs: ["Amigos", "Vida social", "Rede de apoio"] },
            5: { nome: "Vida espiritual", icone: "fa-dove", subs: ["Fé", "Oração", "Atividades religiosas", "Valores pessoais"] },
            6: { nome: "Trabalho e carreira", icone: "fa-briefcase", subs: ["Emprego", "Desenvolvimento profissional", "Objetivos de carreira"] },
            7: { nome: "Finanças", icone: "fa-wallet", subs: ["Controle de gastos", "Poupança", "Investimentos", "Planejamento"] },
            8: { nome: "Educação e aprendizado", icone: "fa-graduation-cap", subs: ["Cursos", "Leitura", "Novas habilidades"] },
            9: { nome: "Lazer e hobbies", icone: "fa-gamepad", subs: ["Esportes", "Música", "Jogos", "Passeios"] },
            10: { nome: "Objetivos e propósito", icone: "fa-bullseye", subs: ["Metas", "Projetos pessoais", "Sonhos"] }
        };

        let filtroTempoAtual = 'hoje'; 
        let dataSelecionadaCalendario = new Date().toISOString().split('T')[0]; 
        let rotinaUsuario = {};
        
        let instanciaGraficoLinha = null;
        let instanciaGraficoPizza = null;

        function sincronizarNuvem() {
            if (window.fbDB) {
                window.fbSet(window.fbRef(window.fbDB, 'rotinaUsuario'), rotinaUsuario);
                window.fbSet(window.fbRef(window.fbDB, 'dadosCategorias'), dadosCategorias);
            }
        }

        function validarAcessoPainel() {
            const userIn = document.getElementById('login-username').value.trim();
            const passIn = document.getElementById('login-password').value.trim();
            const errorMsg = document.getElementById('login-erro-msg');

            if (userIn === "John" && passIn === "souforte") {
                document.getElementById('painel-login-app').classList.add('ocultar');
                document.getElementById('app-principal-wrapper').classList.add('visivel');
                
                filtroTempoAtual = 'hoje';
                document.querySelectorAll('.btn-tempo').forEach(b => b.classList.remove('ativo'));
                document.getElementById('tempo-hoje').classList.add('ativo');
                
                renderizarAgenda();

                setTimeout(() => {
                    canvasConfetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors: ['#d4af37', '#ffffff', '#aa840a'] });
                }, 300);
            } else {
                errorMsg.style.display = "block";
                setTimeout(() => { errorMsg.style.display = "none"; }, 3000);
            }
        }

        document.getElementById('login-password').addEventListener('keyup', function(e) { if (e.key === 'Enter') validarAcessoPainel(); });
        document.getElementById('login-username').addEventListener('keyup', function(e) { if (e.key === 'Enter') validarAcessoPainel(); });

        function toggleMenuLateral() {
            document.getElementById('sidebar-menu').classList.toggle('aberto');
            document.getElementById('menu-overlay').classList.toggle('visivel');
        }

        function abrirModalCustom(titulo, valorInicial, callbackConfirmar) {
            document.getElementById('modal-titulo').innerText = titulo;
            const input = document.getElementById('modal-input-valor');
            input.value = valorInicial;
            document.getElementById('custom-modal').classList.add('visivel');
            
            const btnConfirmar = document.getElementById('modal-btn-confirmar');
            btnConfirmar.onclick = function() {
                callbackConfirmar(input.value);
                fecharModalCustom();
            };
            setTimeout(() => input.focus(), 100);
        }

        function fecharModalCustom() {
            document.getElementById('custom-modal').classList.remove('visivel');
        }

        function selecionarOpcaoTempo(novoTempo) {
            filtroTempoAtual = novoTempo;
            document.querySelectorAll('.btn-tempo').forEach(b => b.classList.remove('ativo'));
            const elem = document.getElementById(`tempo-${novoTempo}`);
            if(elem) elem.classList.add('ativo');
            toggleMenuLateral();
            fecharConfiguracoes();
            renderizarAgenda();
        }

        function abrirConfiguracoes() {
            toggleMenuLateral();
            const painel = document.getElementById('painel-config');
            painel.classList.add('visivel');
            
            const select = document.getElementById('config-cat-select');
            select.innerHTML = '';
            for (const [id, cat] of Object.entries(dadosCategorias)) {
                select.innerHTML += `<option value="${id}">${id}. ${cat.nome}</option>`;
            }
            renderizarGerenciadorSubs();
            document.getElementById('agenda-semanal').style.display = 'none';
        }

        function fecharConfiguracoes() {
            document.getElementById('painel-config').classList.remove('visivel');
            document.getElementById('agenda-semanal').style.display = 'flex';
        }

        function renderizarGerenciadorSubs() {
            const catId = document.getElementById('config-cat-select').value;
            const container = document.getElementById('lista-subs-config');
            container.innerHTML = '';
            if(!dadosCategorias[catId]) return;

            dadosCategorias[catId].subs.forEach((sub, idx) => {
                container.innerHTML += `
                    <span class="tag-subcategoria" style="padding:6px 12px; display:inline-flex; align-items:center; gap:8px; background-color:var(--bg-input);">
                        ${sub}
                        <i class="fas fa-times" style="cursor:pointer; color:var(--cor-perigo);" onclick="removerSubcategoria('${catId}', ${idx})"></i>
                    </span>
                `;
            });
            atualizarTodosSelectsCards();
        }

        function abrirModalNovaCategoriaPai() {
            abrirModalCustom("Nova Categoria Pai", "", function(nome) {
                if (!nome.trim()) return;
                const ids = Object.keys(dadosCategorias).map(Number);
                const proximoId = ids.length > 0 ? Math.max(...ids) + 1 : 1;
                dadosCategorias[proximoId] = { nome: nome.trim(), icone: "fa-star", subs: ["Geral"] };
                sincronizarNuvem(); abrirConfiguracoes();
            });
        }

        function abrirModalRenomearCategoriaPai() {
            const catId = document.getElementById('config-cat-select').value;
            abrirModalCustom("Renomear Categoria Pai", dadosCategorias[catId].nome, function(novoNome) {
                if(novoNome.trim()) { 
                    dadosCategorias[catId].nome = novoNome.trim(); 
                    sincronizarNuvem(); abrirConfiguracoes(); 
                }
            });
        }

        function removerCategoriaPai() {
            const catId = document.getElementById('config-cat-select').value;
            if(confirm("Remover categoria completa?")) { delete dadosCategorias[catId]; sincronizarNuvem(); abrirConfiguracoes(); }
        }

        function abrirModalNovaSubcategoria() {
            const catId = document.getElementById('config-cat-select').value;
            abrirModalCustom("Incluir Subcategoria", "", function(nomeSub) {
                if(nomeSub.trim()) { 
                    dadosCategorias[catId].subs.push(nomeSub.trim()); 
                    sincronizarNuvem(); renderizarGerenciadorSubs(); 
                }
            });
        }

        function removerSubcategoria(catId, idx) {
            dadosCategorias[catId].subs.splice(idx, 1); sincronizarNuvem(); renderizarGerenciadorSubs();
        }

        function atualizarSubcategoriasSelect(blocoId) {
            const catSel = document.getElementById(`cat-${blocoId}`);
            const subSel = document.getElementById(`sub-${blocoId}`);
            if(!catSel || !subSel) return;
            subSel.innerHTML = '';
            if(dadosCategorias[catSel.value]) {
                dadosCategorias[catSel.value].subs.forEach(s => { subSel.innerHTML += `<option value="${s}">${s}</option>`; });
            }
        }

        function atualizarTodosSelectsCards() {
            document.querySelectorAll('.select-custom[id^="cat-"]').forEach(sel => {
                const bId = sel.id.replace('cat-', '');
                const val = sel.value; sel.innerHTML = '';
                for (const [id, cat] of Object.entries(dadosCategorias)) {
                    sel.innerHTML += `<option value="${id}">${id}. ${cat.nome}</option>`;
                }
                if(val) sel.value = val;
                atualizarSubcategoriasSelect(bId);
            });
        }

        function mudarDataCalendario(novaData) {
            dataSelecionadaCalendario = novaData;
            renderizarAgenda();
        }

        function obterEstruturaBlocos() {
            const hoje = new Date();
            const formatar = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
            
            const mapeamentoDias = [
                { id: 'dom', nome: 'Domingo', offset: 7, ordem: 7 },
                { id: 'seg', nome: 'Segunda-feira', offset: 1, ordem: 1 },
                { id: 'ter', nome: 'Terça-feira', offset: 2, ordem: 2 },
                { id: 'qua', nome: 'Quarta-feira', offset: 3, ordem: 3 },
                { id: 'qui', nome: 'Quinta-feira', offset: 4, ordem: 4 },
                { id: 'sex', nome: 'Sexta-feira', offset: 5, ordem: 5 },
                { id: 'sab', nome: 'Sábado', offset: 6, ordem: 6 }
            ];

            const diaSemanaAtual = hoje.getDay() === 0 ? 7 : hoje.getDay();

            if (filtroTempoAtual === 'hoje') {
                const configDia = mapeamentoDias.find(m => m.ordem === diaSemanaAtual);
                const dataCorrespondente = new Date(hoje);
                return [{ 
                    id: configDia.id + '_' + dataCorrespondente.getFullYear() + '_' + (dataCorrespondente.getMonth() + 1), 
                    nome: configDia.nome, 
                    data: formatar(hoje),
                    focoClasse: 'hoje'
                }];
            }
            if (filtroTempoAtual === 'semana') {
                const diasSemanaOrdem = [
                    { id: 'seg', nome: 'Segunda-feira', offset: 1, ordem: 1 }, { id: 'ter', nome: 'Terça-feira', offset: 2, ordem: 2 },
                    { id: 'qua', nome: 'Quarta-feira', offset: 3, ordem: 3 }, { id: 'qui', nome: 'Quinta-feira', offset: 4, ordem: 4 },
                    { id: 'sex', nome: 'Sexta-feira', offset: 5, ordem: 5 }, { id: 'sab', nome: 'Sábado', offset: 6, ordem: 6 },
                    { id: 'dom', nome: 'Domingo', offset: 7, ordem: 7 }
                ];
                return diasSemanaOrdem.map(d => {
                    const r = new Date(hoje); 
                    r.setDate(hoje.getDate() + (d.offset - diaSemanaAtual));
                    
                    let foco = 'futuro';
                    if (d.ordem === diaSemanaAtual) foco = 'hoje';
                    else if (d.ordem < diaSemanaAtual) foco = 'passado';

                    return { 
                        id: d.id + '_' + r.getFullYear() + '_' + (r.getMonth()+1), 
                        nome: d.nome, 
                        data: formatar(r),
                        focoClasse: foco
                    };
                });
            }
            if (filtroTempoAtual === 'mes') {
                const partes = dataSelecionadaCalendario.split('-');
                const dataAlvo = new Date(partes[0], partes[1] - 1, partes[2]);
                const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                
                const dSemana = dataAlvo.getDay();
                const configDia = mapeamentoDias[dSemana];
                const idGlobalUnificado = `${configDia.id}_${partes[0]}_${parseInt(partes[1])}`;

                return [{
                    id: idGlobalUnificado,
                    nome: `${configDia.nome} (${meses[dataAlvo.getMonth()]})`,
                    data: formatar(dataAlvo),
                    isCalendario: true,
                    focoClasse: 'hoje'
                }];
            }
        }

        function renderizarAgenda() {
            const container = document.getElementById('agenda-semanal');
            container.innerHTML = '';

            if(filtroTempoAtual === 'relatorio') {
                renderizarPainelRelatorio(container);
                return;
            }

            const blocos = obterEstruturaBlocos();

            blocos.forEach(b => {
                const card = document.createElement('div');
                card.className = `dia-card ${b.focoClasse}`;
                const tarefas = rotinaUsuario[b.id] || [];
                const ok = tarefas.filter(t => t.concluido).length;
                const pct = tarefas.length > 0 ? Math.round((ok / tarefas.length) * 100) : 0;

                let htmlCalendarioEsquema = '';
                if(b.isCalendario) {
                    htmlCalendarioEsquema = `
                        <div class="calendario-picker-container">
                            <span class="calendario-label"><i class="far fa-calendar-check"></i> Escolha o Mês/Dia para Atualizar:</span>
                            <input type="date" class="input-data-picker" value="${dataSelecionadaCalendario}" onchange="mudarDataCalendario(this.value)">
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="dia-header">
                        <div>
                            <div class="dia-titulo">${b.nome}</div>
                            <div class="dia-data">${b.data}</div>
                        </div>
                        <span class="contador-tarefas" id="contador-${b.id}">${ok}/${tarefas.length}</span>
                    </div>
                    <div class="progresso-container">
                        <div class="progresso-barra" id="barra-${b.id}" style="width: ${pct}%"></div>
                    </div>
                    ${htmlCalendarioEsquema}
                `;

                const lista = document.createElement('ul');
                lista.className = 'rotina-lista';

                tarefas.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.id = `item-${b.id}-${item.id}`;
                    li.className = `rotina-item ${item.concluido ? 'concluido' : ''}`;
                    const cat = dadosCategorias[item.categoria] || { nome: "Foco", icone: "fa-star" };

                    li.innerHTML = `
                        <div class="item-corpo" onclick="alternarStatus('${b.id}', ${item.id})">
                            <div class="checkbox-custom"><i class="fas fa-check" style="color:#000 !important;"></i></div>
                            <div class="item-info-wrapper">
                                <div class="item-conteudo-linha">
                                    <div class="item-texto-wrapper">
                                        ${item.hora ? `<span class="tag-hora-topo"><i class="far fa-clock"></i> ${item.hora}</span>` : ''}
                                        <span class="item-texto">${item.texto}</span>
                                    </div>
                                </div>
                                <div class="item-conteudo-linha">
                                    <div class="item-meta">
                                        <span class="tag-categoria" title="${cat.nome}"><i class="fas ${cat.icone}" style="color:var(--cor-accent) !important;"></i> ${cat.nome}</span>
                                        ${item.subcategoria ? `<span class="tag-subcategoria" title="${item.subcategoria}">${item.subcategoria}</span>` : ''}
                                    </div>
                                    <div class="item-acoes">
                                        <button class="btn-acao" title="Subir" onclick="moverItem('${b.id}', ${index}, -1); event.stopPropagation();"><i class="fas fa-chevron-up"></i></button>
                                        <button class="btn-acao" title="Descer" onclick="moverItem('${b.id}', ${index}, 1); event.stopPropagation();"><i class="fas fa-chevron-down"></i></button>
                                        <button class="btn-acao" title="Editar" onclick="abrirModalEditarItem('${b.id}', ${item.id}); event.stopPropagation();"><i class="fas fa-pencil-alt"></i></button>
                                        <button class="btn-acao btn-excluir" title="Excluir" onclick="excluirItem('${b.id}', ${item.id}); event.stopPropagation();"><i class="fas fa-trash-alt"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    lista.appendChild(li);
                });

                let op = '';
                for (const [id, c] of Object.entries(dadosCategorias)) { op += `<option value="${id}">${id}. ${c.nome}</option>`; }

                const form = document.createElement('div');
                form.className = 'form-add';
                form.innerHTML = `
                    <div class="form-row">
                        <select class="select-custom" id="cat-${b.id}" onchange="atualizarSubcategoriasSelect('${b.id}')">${op}</select>
                        <select class="select-custom" id="sub-${b.id}"></select>
                    </div>
                    <div class="form-row">
                        <input type="text" placeholder="Anotação..." class="input-texto" id="txt-${b.id}">
                        <input type="time" class="input-hora" style="width:105px;" id="hora-${b.id}">
                    </div>
                    <button class="btn-salvar" onclick="adicionarItem('${b.id}')">Confirmar na Agenda</button>
                `;

                card.appendChild(lista);
                card.appendChild(form);
                container.appendChild(card);
                atualizarSubcategoriasSelect(b.id);
            });
        }

        function renderizarPainelRelatorio(containerTarget) {
            let totalGeral = 0;
            let concluidasGeral = 0;
            let contagemCategorias = {};

            for (const key in dadosCategorias) { contagemCategorias[key] = 0; }

            Object.keys(rotinaUsuario).forEach(blocoId => {
                const tarefasBloco = rotinaUsuario[blocoId] || [];
                tarefasBloco.forEach(t => {
                    totalGeral++;
                    if(t.concluido) concluidasGeral++;
                    if(contagemCategorias[t.categoria] !== undefined) { contagemCategorias[t.categoria]++; }
                });
            });

            const taxaEficiencia = totalGeral > 0 ? Math.round((concluidasGeral / totalGeral) * 100) : 0;

            const cardRelatorio = document.createElement('div');
            cardRelatorio.className = 'dia-card hoje';
            cardRelatorio.style.minHeight = 'auto';

            cardRelatorio.innerHTML = `
                <div class="dia-header" style="margin-bottom: 20px;">
                    <div>
                        <div class="dia-titulo"><i class="fas fa-chart-pie" style="color:var(--cor-accent);"></i> Relatório de Desempenho</div>
                        <div class="dia-data">Métricas consolidadas de todas as páginas</div>
                    </div>
                </div>
                <div class="relatorio-container">
                    <div class="grid-cards-mini">
                        <div class="card-mini-metrica">
                            <span>Eficiência</span>
                            <strong class="gold">${taxaEficiencia}%</strong>
                        </div>
                        <div class="card-mini-metrica">
                            <span>Criadas</span>
                            <strong>${totalGeral}</strong>
                        </div>
                        <div class="card-mini-metrica">
                            <span>Feitas</span>
                            <strong style="color:var(--cor-sucesso);">${concluidasGeral}</strong>
                        </div>
                    </div>
                    <div class="box-grafico">
                        <h4><i class="fas fa-chart-line"></i> Produtividade por Bloco</h4>
                        <div class="wrapper-canvas">
                            <canvas id="chartEvolucaoLinha"></canvas>
                        </div>
                    </div>
                    <div class="box-grafico">
                        <h4><i class="fas fa-chart-pie"></i> Distribuição de Foco</h4>
                        <div class="wrapper-canvas" style="height: 200px;">
                            <canvas id="chartCategoriasPizza"></canvas>
                        </div>
                    </div>
                </div>
            `;

            containerTarget.appendChild(cardRelatorio);

            let labelsLinha = [];
            let dadosConcluidos = [];
            let dadosTotais = [];

            Object.keys(rotinaUsuario).slice(-6).forEach(bloco => {
                labelsLinha.push(bloco.split('_')[0].toUpperCase());
                const arr = rotinaUsuario[bloco] || [];
                dadosTotais.push(arr.length);
                dadosConcluidos.push(arr.filter(x => x.concluido).length);
            });

            if(labelsLinha.length === 0) { labelsLinha = ["NENHUM"]; dadosTotais = [0]; dadosConcluidos = [0]; }

            setTimeout(() => {
                const ctxLinha = document.getElementById('chartEvolucaoLinha').getContext('2d');
                if (instanciaGraficoLinha) instanciaGraficoLinha.destroy();
                instanciaGraficoLinha = new Chart(ctxLinha, {
                    type: 'line',
                    data: {
                        labels: labelsLinha,
                        datasets: [
                            {
                                label: 'Concluídas',
                                data: dadosConcluidos,
                                borderColor: '#30d158',
                                backgroundColor: 'rgba(48, 209, 88, 0.1)',
                                tension: 0.3,
                                fill: true
                            },
                            {
                                label: 'Totais',
                                data: dadosTotais,
                                borderColor: '#d4af37',
                                backgroundColor: 'transparent',
                                tension: 0.3,
                                borderDash: [4, 4]
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 10 } } },
                            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8e8e93', font: { size: 10 }, stepSize: 1 } }
                        }
                    }
                });

                let labelsPizza = [];
                let dadosPizza = [];
                for (const id in contagemCategorias) {
                    if(contagemCategorias[id] > 0) {
                        labelsPizza.push(dadosCategorias[id].nome);
                        dadosPizza.push(contagemCategorias[id]);
                    }
                }

                if(labelsPizza.length === 0) { labelsPizza = ["Sem Tarefas"]; dadosPizza = [1]; }

                const ctxPizza = document.getElementById('chartCategoriasPizza').getContext('2d');
                if (instanciaGraficoPizza) instanciaGraficoPizza.destroy();
                instanciaGraficoPizza = new Chart(ctxPizza, {
                    type: 'doughnut',
                    data: {
                        labels: labelsPizza,
                        datasets: [{
                            data: dadosPizza,
                            backgroundColor: ['#d4af37', '#30d158', '#ff453a', '#0a84ff', '#bf5af2', '#ff9f0a', '#5e5ce6', '#64d2ff', '#ff375f', '#ac8e68'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: { color: '#f5f5f7', font: { size: 9 }, boxWidth: 10 }
                            }
                        }
                    }
                });
            }, 50);
        }

        function alternarStatus(bId, itemId) {
            const t = rotinaUsuario[bId].find(x => x.id === itemId);
            t.concluido = !t.concluido;
            
            const elementoDOM = document.getElementById(`item-${bId}-${itemId}`);

            if (elementoDOM) {
                if (t.concluido) {
                    elementoDOM.classList.add('concluido');
                    elementoDOM.classList.add('animar-concluido');
                } else {
                    elementoDOM.classList.remove('concluido');
                    elementoDOM.classList.remove('animar-concluido');
                }
            }

            const totalTarefas = rotinaUsuario[bId].length;
            const concluidas = rotinaUsuario[bId].filter(x => x.concluido).length;
            const novaPct = totalTarefas > 0 ? Math.round((concluidas / totalTarefas) * 100) : 0;
            
            const contElem = document.getElementById(`contador-${bId}`);
            const barraElem = document.getElementById(`barra-${bId}`);
            if (contElem) contElem.innerText = `${concluidas}/${totalTarefas}`;
            if (barraElem) barraElem.style.width = `${novaPct}%`;

            if(t.concluido) {
                const audio = document.getElementById('audio-confirmacao');
                if(audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("Som ativo."));
                }
                canvasConfetti({ particleCount: 50, spread: 45, origin: { y: 0.82 }, colors: ['#d4af37', '#ffffff'] });
            }
            
            sincronizarNuvem(); 
            setTimeout(() => { if(elementoDOM) elementoDOM.classList.remove('animar-concluido'); }, 400);
        }

        function adicionarItem(bId) {
            const cat = document.getElementById(`cat-${bId}`).value;
            const sub = document.getElementById(`sub-${bId}`).value;
            const txt = document.getElementById(`txt-${bId}`).value.trim();
            const hora = document.getElementById(`hora-${bId}`).value;

            if(!rotinaUsuario[bId]) rotinaUsuario[bId] = [];
            rotinaUsuario[bId].push({
                id: Date.now(),
                texto: txt !== "" ? `${sub} — ${txt}` : sub,
                categoria: parseInt(cat),
                subcategoria: sub,
                hora: hora || null,
                concluido: false
            });
            sincronizarNuvem(); renderizarAgenda();
        }

        function abrirModalEditarItem(bId, itemId) {
            const t = rotinaUsuario[bId].find(x => x.id === itemId);
            abrirModalCustom("Altere a anotação:", t.texto, function(novoTexto) {
                if(novoTexto.trim()) {
                    t.texto = novoTexto.trim();
                    sincronizarNuvem(); renderizarAgenda();
                }
            });
        }

        function moverItem(bId, index, direcao) {
            const novasTarefas = [...rotinaUsuario[bId]];
            const alvo = index + direcao;
            if (alvo >= 0 && alvo < novasTarefas.length) {
                const temp = novasTarefas[index];
                novasTarefas[index] = novasTarefas[alvo];
                novasTarefas[alvo] = temp;
                rotinaUsuario[bId] = novasTarefas;
                sincronizarNuvem(); renderizarAgenda();
            }
        }

        function excluirItem(bId, itemId) {
            rotinaUsuario[bId] = rotinaUsuario[bId].filter(x => x.id !== itemId);
            sincronizarNuvem(); renderizarAgenda();
        }
    </script>
</body>
</html>
